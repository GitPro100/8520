<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>8520.04.05 App Rev_MC</title>
  <style>
    :root {
      --ink:#111827;
      --muted:#6b7280;
      --line:#d1d5db;
      --panel:#ffffff;
      --bg:#f5f7fb;
      --blue:#1d4ed8;
      --green:#07883b;
      --red:#b91c1c;
      --shadow:0 12px 32px rgba(15,23,42,.08);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      background:var(--bg);
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      font-size:18px;
      line-height:1.45;
    }
    .wrap { max-width:1080px; margin:auto; padding:18px 16px 50px; }
    .top { display:flex; align-items:center; justify-content:flex-end; margin-bottom:12px; }
    .progress { width:240px; height:10px; background:#e5e7eb; border-radius:99px; overflow:hidden; }
    .progress div { height:100%; background:#111827; width:0; transition:.25s; }
    .progressText { font-size:13px; color:var(--muted); text-align:right; margin-top:5px; }
    .screen {
      background:var(--panel);
      border:1px solid #e5e7eb;
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:26px;
      margin-bottom:16px;
    }
    .hidden { display:none!important; }
    #app {
      opacity:1;
      transition:opacity .25s ease;
    }
    #app.screenFading {
      opacity:0;
      pointer-events:none;
    }
    @media (prefers-reduced-motion:reduce) {
      #app { transition:none; }
    }
    h1,h2,h3 { line-height:1.2; }
    h2 { font-size:28px; margin:0 0 16px; }
    .standardTitle { font-size:24px; margin:0 0 16px; line-height:1.25; }
    h3 { font-size:21px; margin:0 0 12px; }
    .lead { font-size:20px; }
    .muted { color:var(--muted); }
    .notice {
      border-left:4px solid var(--blue);
      background:#eff6ff;
      padding:12px 14px;
      border-radius:10px;
      margin:14px 0;
    }
    .warn { border-left-color:var(--red); background:#fef2f2; color:#7f1d1d; }
    .ok { border-left-color:var(--green); background:#ecfdf5; color:#065f46; }
    .matrixWrap {
      overflow-x:hidden;
      margin:16px 0 4px;
      border:1px solid #d1d5db;
      border-radius:10px;
      background:#fff;
    }
    .matrixTable {
      width:100%;
      min-width:0;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:14px;
    }
    .matrixTable th,
    .matrixTable td {
      border-bottom:1px solid #d1d5db;
      border-right:1px solid #e5e7eb;
      padding:9px 5px;
      text-align:center;
      vertical-align:middle;
    }
    .matrixTable tr:last-child th,
    .matrixTable tr:last-child td { border-bottom:0; }
    .matrixTable th:last-child,
    .matrixTable td:last-child { border-right:0; }
    .matrixTable .statementHead,
    .matrixTable .statement {
      width:42%;
      text-align:left;
    }
    .matrixTable .anchorRow th {
      padding:8px 2px 5px;
      border-bottom:0;
      font-size:12px;
      line-height:1.18;
      font-weight:700;
      vertical-align:bottom;
      overflow-wrap:anywhere;
    }
    .matrixTable .anchorRow .blankHead { background:#fff; }
    .matrixTable .numberRow th {
      padding:5px 4px 8px;
      background:#f8fafc;
      font-size:14px;
    }
    .matrixTable .statement {
      font-weight:400;
      background:#fff;
    }
    .matrixTable tbody tr:nth-child(even) .statement,
    .matrixTable tbody tr:nth-child(even) td { background:#fafafa; }
    .matrixTable input[type="radio"] {
      width:18px;
      height:18px;
      margin:0;
      cursor:pointer;
    }
    .compactSelect {
      width:auto!important;
      max-width:100%!important;
      min-width:0!important;
      display:inline-block;
    }
    .compactAge {
      width:92px!important;
      max-width:92px!important;
      min-width:92px!important;
      display:inline-block;
    }
    .btnrow { display:flex; gap:12px; flex-wrap:wrap; margin-top:22px; }
    button {
      border:0;
      border-radius:12px;
      padding:13px 18px;
      background:#111827;
      color:#fff;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
    }
    button.secondary { background:#e5e7eb; color:#111827; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .manip { border:1px solid var(--line); border-radius:14px; padding:18px; margin:14px 0; background:#fafafa; }

    /* Compact development layout so the About screen fits within a laptop viewport. */
    .screen.compactAbout { padding:17px 22px; }
    .compactAbout h2 { font-size:25px; margin-bottom:9px; }
    .compactAbout > p { margin:5px 0 8px; font-size:16px; line-height:1.35; }
    .compactAbout .manip { padding:10px 14px; margin:8px 0; }
    .compactAbout .manip h3 { font-size:18px; margin-bottom:5px; }
    .compactAbout .manip p { margin:3px 0; font-size:16px; line-height:1.3; }
    .compactAbout .btnrow { margin-top:11px; }
    .compactAbout button { padding:10px 16px; }
    .aboutBlue { color:#1d4ed8; }

    /* Compact development layout for the condition/understanding check, including corrective feedback. */
    .screen.compactAttention { padding:13px 18px; }
    .compactAttention h2 { font-size:23px; margin-bottom:7px; }
    .compactAttention .conditionPanel { gap:6px; padding:7px; margin:0 0 7px; }
    .compactAttention .conditionPanel div { padding:5px 7px; }
    .compactAttention .conditionPanel span { font-size:11px; line-height:1.15; }
    .compactAttention .conditionPanel strong { font-size:14px; line-height:1.15; margin-top:1px; }
    .compactAttention .manip { padding:7px 10px; margin:5px 0; }
    .compactAttention .manip p { margin:0 0 4px; font-size:14px; line-height:1.22; }
    .compactAttention .choiceList { gap:4px; margin-top:4px; }
    .compactAttention .choiceList label { gap:7px; padding:5px 8px; border-radius:8px; font-size:13px; line-height:1.18; }
    .compactAttention .choiceList input { margin-top:2px; transform:scale(1.05); }
    .compactAttention #attentionFeedback { margin:5px 0; padding:7px 10px; font-size:13px; line-height:1.18; }
    .compactAttention #attentionFeedback p { margin:3px 0; }
    .compactAttention .btnrow { margin-top:7px; }
    .compactAttention button { padding:8px 13px; font-size:14px; }

    /* Researcher-only styling for the opening Test Mode condition-selection screen only. */
    body.testMode {
      --test-brown:#7a4b2a;
      --test-brown-dark:#5d351d;
      --test-brown-mid:#a87349;
      --test-brown-line:#c9a98d;
      --test-tan:#f5eadf;
      --test-tan-light:#fbf6f1;
    }
    body.testConditionScreen .progress div { background:var(--test-brown); }
    body.testConditionScreen .progressText { color:var(--test-brown-dark); font-weight:800; }
    .screen.testModeScreen {
      position:relative;
      border:2px solid var(--test-brown-mid);
      background:var(--test-tan-light);
      box-shadow:0 12px 32px rgba(93,53,29,.13);
    }
    .screen.testModeScreen::before {
      content:"TEST MODE";
      position:absolute;
      top:0;
      right:0;
      padding:6px 12px;
      border-radius:0 15px 0 10px;
      background:var(--test-brown);
      color:#fff;
      font-size:12px;
      line-height:1;
      font-weight:900;
      letter-spacing:.08em;
    }
    .screen.testModeScreen button { background:var(--test-brown); }
    .screen.testModeScreen button:hover,
    .screen.testModeScreen button:focus-visible { background:var(--test-brown-dark); }
    .screen.testModeScreen button.secondary { background:#ead8c9; color:#3f2818; }
    .screen.testModeScreen .notice {
      border-left-color:var(--test-brown);
      background:#f2e3d6;
      color:#4b2c1a;
    }

    /* 2 × 2 experimental-design selector shown only in Test Mode. */
    .testDesignWrap {
      margin:18px 0 6px;
      overflow-x:auto;
      padding-bottom:3px;
    }
    .testDesignMatrix {
      display:grid;
      grid-template-columns:180px repeat(2,minmax(250px,1fr));
      min-width:720px;
      border:1px solid var(--test-brown-line,#c9a98d);
      border-radius:13px;
      overflow:hidden;
      background:#fff;
    }
    .testMatrixCorner,
    .testMatrixColHead,
    .testMatrixRowHead,
    .testConditionCell {
      border-right:1px solid var(--test-brown-line,#c9a98d);
      border-bottom:1px solid var(--test-brown-line,#c9a98d);
    }
    .testDesignMatrix > :nth-child(3n) { border-right:0; }
    .testDesignMatrix > :nth-last-child(-n+3) { border-bottom:0; }
    .testMatrixCorner {
      padding:13px 12px;
      background:#e5cfbd;
      color:#4b2c1a;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      line-height:1.2;
    }
    .testMatrixColHead {
      padding:12px 10px;
      background:#e5cfbd;
      color:#4b2c1a;
      font-weight:900;
      text-align:center;
    }
    .testMatrixColHead .factorName {
      display:block;
      margin-bottom:2px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:#765239;
    }
    .testMatrixRowHead {
      padding:13px 12px;
      background:#efe0d3;
      color:#4b2c1a;
      font-weight:900;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:center;
      line-height:1.25;
    }
    .testMatrixRowHead .factorName {
      display:block;
      margin-bottom:3px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:#765239;
    }
    .testConditionCell {
      position:relative;
      display:block;
      min-height:150px;
      padding:16px 16px 14px 44px;
      background:#fffaf6;
      cursor:pointer;
      transition:background .12s ease, box-shadow .12s ease;
    }
    .testConditionCell:hover,
    .testConditionCell:focus-within { background:#f5eadf; }
    .testConditionCell:has(input:checked) {
      background:#e8d3c2;
      box-shadow:inset 0 0 0 3px var(--test-brown,#7a4b2a);
    }
    .testConditionCell input[type="radio"] {
      position:absolute;
      top:18px;
      left:16px;
      width:18px;
      height:18px;
      accent-color:var(--test-brown,#7a4b2a);
      cursor:pointer;
    }
    .testConditionNumber {
      display:block;
      color:var(--test-brown-dark,#5d351d);
      font-size:18px;
      line-height:1.2;
      font-weight:900;
      margin-bottom:7px;
    }
    .testConditionFactor {
      display:block;
      font-size:14px;
      line-height:1.35;
      font-weight:800;
      margin-bottom:5px;
    }
    .testConditionDetail {
      display:block;
      color:#6f5848;
      font-size:13px;
      line-height:1.35;
      font-weight:400;
    }

    .conditionPanel {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      border:2px dashed #94a3b8;
      background:#f8fafc;
      padding:13px;
      border-radius:12px;
      margin:0 0 20px;
    }
    .conditionPanel div { background:#fff; border:1px solid #dbe1e8; border-radius:9px; padding:9px 10px; }
    .conditionPanel span { display:block; color:var(--muted); font-size:13px; }
    .conditionPanel strong { display:block; margin-top:2px; }
    .choiceList { display:grid; gap:10px; margin-top:14px; }
    .choiceList label,.scaleRow label,.bipolarRow label { cursor:pointer; }
    .choiceList label {
      display:flex;
      gap:10px;
      align-items:flex-start;
      border:1px solid #d1d5db;
      border-radius:12px;
      padding:13px;
      background:#fff;
    }
    .choiceList input { margin-top:5px; transform:scale(1.2); }

    /* Standardized 200 × 80 product cards with balanced vertical spacing. */
    .productCard {
      width:200px;
      height:80px;
      min-width:200px;
      max-width:200px;
      min-height:80px;
      max-height:80px;
      overflow:hidden;
      border:1px solid #b8bcc4;
      border-radius:10px;
      background:#fff;
      padding:5px 8px;
      box-shadow:0 2px 7px rgba(0,0,0,.03);
      display:flex;
      flex-direction:column;
    }
    .productCard .role {
      flex:0 0 auto;
      text-align:center;
      font-size:12px;
      line-height:1.05;
      font-weight:700;
      margin:0;
      white-space:nowrap;
    }
    .productCard.noRole {
      justify-content:space-evenly;
      padding-top:6px;
      padding-bottom:6px;
    }
    .divider { flex:0 0 1px; height:1px; background:#c7c9cd; margin:3px 0 2px; }
    .attr {
      flex:1 1 0;
      min-height:0;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
      gap:7px;
      font-size:10.8px;
      line-height:1.2;
      padding:0 0 1px;
      white-space:nowrap;
    }
    .productCard.noRole .attr { font-size:11px; }
    .attr span,
    .attr strong { line-height:1.2; padding-bottom:1px; }
    .attr span { overflow:hidden; text-overflow:ellipsis; }
    .targetBox { display:flex; justify-content:flex-start; margin:12px 0; }
    .recommendWrap { display:grid; grid-template-columns:240px minmax(0,1fr); gap:22px; align-items:stretch; }
    .infoPanel,
    .actionPanel {
      border:1px solid #d7dde5;
      border-radius:14px;
      padding:16px;
      min-width:0;
    }
    .infoPanel { background:#f8fafc; }
    .actionPanel { background:#fff; }
    .panelHeaderBlock {
      min-height:0;
      margin-bottom:6px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }
    .panelHeading {
      margin:0 0 4px;
      font-size:19px;
      line-height:1.2;
      font-weight:800;
      color:#111827;
    }
    .panelInstruction {
      margin:0;
      color:#4b5563;
      font-size:14px;
      line-height:1.35;
    }
    .recommendCards { display:grid; gap:10px; justify-items:center; }
    .recommendCards .productCard.wideRevisedRole {
      width:220px;
      min-width:220px;
      max-width:220px;
    }
    .revisedRecommendWrap .recommendCards .productCard {
      width:220px;
      min-width:220px;
      max-width:220px;
    }
    .revisedRecommendWrap { grid-template-columns:254px minmax(0,1fr); }
    .actionPanel .choiceButton:first-of-type { margin-top:0; }
    .actionPanel .choiceButton {
      position:relative;
      width:100%;
      margin:7px 0;
      padding:14px 44px 14px 16px;
      text-align:left;
      background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
      color:#111827;
      border:2px solid #64748b;
      border-radius:12px;
      box-shadow:0 3px 0 #cbd5e1, 0 7px 14px rgba(15,23,42,.08);
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
    }
    .actionPanel .choiceButton::after {
      content:"›";
      position:absolute;
      right:17px;
      top:50%;
      transform:translateY(-52%);
      font-size:27px;
      line-height:1;
      color:#334155;
    }
    .actionPanel .choiceButton:hover,
    .actionPanel .choiceButton:focus-visible {
      border-color:#1d4ed8;
      background:#eff6ff;
      box-shadow:0 3px 0 #93c5fd, 0 9px 18px rgba(29,78,216,.15);
      transform:translateY(-1px);
      outline:none;
    }
    .actionPanel .choiceButton:active {
      transform:translateY(2px);
      box-shadow:0 1px 0 #94a3b8, 0 3px 8px rgba(15,23,42,.10);
    }
    .optionChoice:hover,
    .optionChoice:focus-within {
      transform:translateY(-2px);
      border-color:#94a3b8;
      box-shadow:0 7px 16px rgba(15,23,42,.10);
    }
    .optionsGrid {
      display:grid;
      grid-template-columns:repeat(auto-fit,200px);
      justify-content:center;
      gap:16px;
    }
    .optionChoice { display:block; width:200px; border:2px solid transparent; border-radius:11px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
    .optionChoice input { position:absolute; opacity:0; }
    .optionChoice:has(input:checked) { border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,78,216,.13); }
    .optionChoice .productCard { width:200px; }
    .taskIntro p { margin:10px 0; }
    .taskIntro .goalLine { margin-top:2px; }
    .taskIntro .simpleExplanation {
      margin:8px 0 15px;
      padding:0;
      border:0;
      background:transparent;
      border-radius:0;
      font-size:inherit;
    }
    .taskIntro .taskSubhead { margin:15px 0 4px; text-decoration:underline; }
    .taskIntro .taskSteps { list-style:none; padding:0; margin:4px 0 14px; }
    .taskIntro .taskSteps li { margin:2px 0; }
    .taskIntro .taskBlue { color:#1d4ed8; }
    .taskIntro .bonus { color:#07883b; }
    .taskIntro .readyLine { margin-top:20px; font-weight:700; }
    .taskIntro .notice { margin-top:12px; }
    .exampleHeading {
      margin:28px 0 14px;
      font-size:20px;
      line-height:1.25;
      font-weight:800;
    }
    .accuracyExample {
      display:grid;
      grid-template-columns:minmax(150px,1.05fr) minmax(185px,1.15fr) 110px minmax(185px,1.15fr) minmax(185px,1.15fr);
      gap:18px;
      align-items:stretch;
      margin:0;
    }
    .exampleTvVisual {
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:0;
      padding:10px 0;
    }
    .exampleTvImage {
      display:block;
      width:100%;
      max-width:205px;
      height:auto;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }
    .exampleCard {
      overflow:hidden;
      min-width:0;
      border:1.5px solid #aeb8c7;
      border-radius:12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(15,23,42,.04);
    }
    .exampleCard.objective { border:2px solid #1264e6; }
    .exampleCard.best { border:2px solid #11872f; background:#fbfffb; }
    .exampleCardHeader {
      padding:13px 16px;
      border-bottom:1px solid #d6dce5;
      font-size:18px;
      line-height:1.15;
      font-weight:800;
      color:#374151;
    }
    .exampleCard.objective .exampleCardHeader {
      color:#fff;
      border-bottom:0;
      background:linear-gradient(180deg,#1267eb 0%,#0758d5 100%);
    }
    .exampleCard.best .exampleCardHeader {
      color:#087b27;
      background:#f3fbf4;
    }
    .exampleRows { padding:10px 16px 8px; }
    .exampleRow {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px;
      align-items:center;
      min-height:43px;
      border-bottom:1px solid #d9dee6;
      font-size:15px;
      line-height:1.2;
    }
    .exampleRow:last-child { border-bottom:0; }
    .exampleRow strong { font-size:15px; white-space:nowrap; }
    .exampleMatch {
      padding:10px 12px;
      border-top:1px solid #cde8d2;
      background:#effaf1;
      color:#087b27;
      text-align:center;
      font-size:15px;
      line-height:1.15;
      font-weight:800;
    }
    .exampleCompare {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      color:#111827;
      text-align:center;
      font-size:14px;
      line-height:1.18;
      font-weight:750;
    }
    .exampleArrow {
      color:#1264e6;
      font-size:48px;
      line-height:.7;
      font-weight:400;
    }
    .exampleCorrect {
      grid-column:1 / -1;
      margin-top:10px;
      padding:14px 20px;
      border:1.5px solid #11872f;
      border-radius:10px;
      background:#f4fbf5;
      color:#1f2937;
      font-size:16px;
      line-height:1.3;
    }
    .exampleCorrect strong { color:#087b27; font-size:18px; }
    .exampleNav {
      justify-content:space-between;
      align-items:center;
      margin-top:16px;
    }
    .exampleNav button:last-child {
      min-width:118px;
      background:#1264e6;
    }
    .reminderLabel {
      width:200px;
      margin:7px 0 -3px;
      font-size:15px;
      line-height:1.2;
      font-weight:800;
      text-align:left;
    }
    @media (max-width:900px) {
      .accuracyExample { grid-template-columns:1fr 1fr; }
      .exampleTvVisual { grid-column:1 / -1; }
      .exampleCompare { display:none; }
      .exampleCorrect { grid-column:1 / -1; }
    }
    .aboutConfirm {
      display:flex;
      align-items:flex-start;
      gap:9px;
      margin:9px 0 2px;
      padding:8px 10px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      background:#fff;
      font-size:14px;
      line-height:1.25;
      font-weight:600;
      cursor:pointer;
    }
    .aboutConfirm input { width:17px; height:17px; margin:1px 0 0; flex:0 0 auto; }
    .waitReminder {
      max-width:700px;
      margin:18px auto 0;
      padding:10px 14px;
      border-radius:10px;
      background:#f8fafc;
      border:1px solid #dbe1e8;
      color:#374151;
      font-size:16px;
      line-height:1.35;
    }
    .screen.compactTaskIntro { padding:16px 22px; }
    .compactTaskIntro h2 { font-size:25px; margin-bottom:8px; }
    .compactTaskIntro .taskIntro p { margin:6px 0; font-size:15.5px; line-height:1.28; }
    .compactTaskIntro .taskIntro .simpleExplanation {
      margin:6px 0 9px;
      padding:0;
      border:0;
      background:transparent;
      border-radius:0;
      font-size:15.5px;
      line-height:1.28;
    }
    .compactTaskIntro .taskIntro .taskSubhead { margin:8px 0 2px; }
    .compactTaskIntro .taskIntro .taskSteps { margin:2px 0 8px; }
    .compactTaskIntro .taskIntro .taskSteps li { margin:1px 0; font-size:15px; line-height:1.25; }
    .compactTaskIntro .taskIntro .notice { margin:8px 0; padding:8px 11px; font-size:15px; }
    .compactTaskIntro .btnrow { margin-top:9px; }
    .compactTaskIntro button { padding:9px 15px; }

    .targetTaskLayout {

      gap:22px;
      align-items:center;
      margin:8px 0 10px;
      min-height:170px;

    .targetCardColumn {

      justify-content:flex-start;
      align-items:flex-start;
      align-self:center;
      padding-top:0;
    }
    .targetTaskLayout .productCard {
      width:250px;
      height:100px;
      min-width:250px;
      max-width:250px;
      min-height:100px;
      max-height:100px;
      padding:7px 10px;
    }
    .targetTaskLayout .productCard .role { font-size:15px; }
    .targetTaskLayout .productCard .attr { font-size:13px; line-height:1.12; }

    .productImageWrap {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      min-height:135px;
      max-height:175px;

    /* Compact the worked example enough to fit comfortably on a laptop screen. */
    .screen.taskExampleCompact { padding:13px 20px 14px; }
    .taskExampleCompact h2 { font-size:29px; margin:0 0 5px; line-height:1.12; font-weight:400; }
    .taskExampleCompact .taskIntro p { margin:4px 0; font-size:14.5px; line-height:1.24; }
    .taskExampleCompact .taskIntro .simpleExplanation { margin:4px 0 7px; font-size:14.5px; line-height:1.24; }
    .taskExampleCompact .exampleHeading { margin:9px 0 7px; font-size:14.5px; line-height:1.24; font-weight:800; }
    .taskExampleCompact .accuracyExample {
      grid-template-columns:minmax(105px,.85fr) minmax(145px,1.08fr) 72px minmax(145px,1.08fr) minmax(145px,1.08fr);
      gap:10px;
    }
    .taskExampleCompact .exampleTvVisual { padding:4px 0; }
    .taskExampleCompact .exampleTvImage { max-width:150px; }
    .taskExampleCompact .accuracyExample > .exampleCard,
    .taskExampleCompact .accuracyExample > .exampleBestWrap {
      align-self:start;
      margin-top:43px;
    }
    .taskExampleCompact .accuracyExample > .exampleCompare {
      align-self:center;
    }
    /* Match the worked-example cards to the cards used in the actual product-choice tasks. */
    .taskExampleCompact .exampleCard {
      height:80px;
      min-height:80px;
      max-height:80px;
      overflow:hidden;
      border:1px solid #b8bcc4;
      border-radius:10px;
      background:#fff;
      padding:5px 8px;
      box-shadow:0 2px 7px rgba(0,0,0,.03);
      display:flex;
      flex-direction:column;
    }
    .taskExampleCompact .exampleCard.objective {
      border:1px solid #b8bcc4;
      background:#fff;
    }
    .taskExampleCompact .exampleCard.best {
      border:2px solid #11872f;
      background:#fff;
      padding:4px 7px;
    }
    .taskExampleCompact .exampleCardHeader,
    .taskExampleCompact .exampleCard.objective .exampleCardHeader,

      flex:0 0 auto;
      padding:0 0 3px;
      margin:0 0 2px;
      border:0;

      text-align:center;
      font-size:12px;
      line-height:1.05;
      font-weight:700;

(function(){
  "use strict";

  const STUDY_LABEL = "8520.04.05 App Rev_MC";
  const BUILD_VERSION = "2026_0906_0757";
  const TOTAL_STEPS = 15;
  const $ = selector => document.querySelector(selector);
  const app = $("#app");
  const qs = new URLSearchParams(location.search);
  const suppliedPid = qs.get("PROLIFIC_PID") || qs.get("pid") || "";
  const prolificStudyId = qs.get("STUDY_ID") || "";
  const prolificSessionId = qs.get("SESSION_ID") || "";
  const pid = suppliedPid || "anonymous";

  function hash(text){
    let h=2166136261;
    for(let i=0;i<text.length;i++){
      h ^= text.charCodeAt(i);
      h = Math.imul(h,16777619);
    }
    return h>>>0;
  }

  function seeded(seed){
    let x=seed||123456789;
    return () => {
      x ^= x<<13;
      x ^= x>>>17;
      x ^= x<<5;
      return (x>>>0)/4294967296;
    };
  }

  function localRandomToken(){
    try {
      const values=new Uint32Array(2);
      crypto.getRandomValues(values);
      return Array.from(values).join("-");
    } catch(error) {
      return Date.now()+"-"+Math.random();
    }
  }

  // Qualtrics assigns the experimental condition. The app uses the participant ID only
  // to create a stable task order and stable additional-option order within that condition.
  const randomizationIdentity = suppliedPid || ("anonymous-test|"+localRandomToken());
  const rnd = seeded(hash(randomizationIdentity + "|" + STUDY_LABEL));
  function shuf(values){
    const a=[...values];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(rnd()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  const testMode = location.protocol==="file:" ||
    ["1","true","yes"].includes((qs.get("test") || "").toLowerCase()) ||
    ["1","true","yes"].includes((qs.get("test_mode") || "").toLowerCase()) ||
    (qs.get("mode") || "").toLowerCase()==="test";

  document.body.classList.toggle("testMode",testMode);

  let condition = null;
  let cond_aut = null;
  let cond_obj = null;

  function factorsForCondition(conditionNumber){
    return {
      cond_aut:(conditionNumber===2 || conditionNumber===4) ? 1 : 0,
      cond_obj:(conditionNumber===3 || conditionNumber===4) ? 1 : 0
    };
  }

  function stopForIntegrationError(message, technicalDetail){
    app.innerHTML = `<section class="screen">
      <h2>Technical error</h2>
      <p>${message}</p>
      <p>Please contact the researcher and do not continue.</p>
    </section>`;
    throw new Error(technicalDetail);
  }

  if(testMode){
    const suppliedTestCondition=Number(qs.get("condition"));
    if([1,2,3,4].includes(suppliedTestCondition)){
      condition=suppliedTestCondition;
      const factors=factorsForCondition(condition);
      cond_aut=factors.cond_aut;
      cond_obj=factors.cond_obj;
    }
  } else {
    const conditionWasSupplied = qs.has("condition");
    condition = Number(qs.get("condition"));

    if(!conditionWasSupplied || ![1,2,3,4].includes(condition)){
      stopForIntegrationError(
        "The experimental condition was not received correctly.",
        "Missing or invalid Qualtrics condition."
      );
    }

    const expectedFactors=factorsForCondition(condition);
    const condAutRaw = qs.get("cond_aut");
    const condObjRaw = qs.get("cond_obj");

    if(!/^[01]$/.test(condAutRaw || "") || !/^[01]$/.test(condObjRaw || "")){
      stopForIntegrationError(
        "The experimental-condition values were not received correctly.",
        "Missing or invalid Qualtrics condition-factor value."
      );
    }

    cond_aut = Number(condAutRaw);
    cond_obj = Number(condObjRaw);

    if(cond_aut!==expectedFactors.cond_aut || cond_obj!==expectedFactors.cond_obj){
      stopForIntegrationError(
        "The experimental-condition values are inconsistent.",
        "Inconsistent Qualtrics condition values."
      );
    }
  }

  const taskOrder=shuf(Object.keys(PROFILES));
  const additionalOptionOrder={};
  Object.keys(PROFILES).forEach(name=>{
    additionalOptionOrder[name]=shuf(Array.from({length:16},(_,index)=>index+2));
  });

  // Randomize only the substantive alternatives; keep the residual alternative last.
  const comprehensionOptionOrder={
    objective:[...shuf([0,1]),9],
    autonomy:[...shuf([0,1]),9]
  };

  const state = {
    studyVersion:STUDY_LABEL,
    buildVersion:BUILD_VERSION,
    pid,
    prolificStudyId,
    prolificSessionId,
    test_mode:testMode?1:0,
    randomization_source:testMode ? "Test-mode condition selector" : "Qualtrics Survey Flow",
    within_app_order_randomization_source:suppliedPid ? "stable participant-ID seed" : "fresh local-test seed",
    condition,
    cond_aut,
    cond_obj,
    startISO:new Date().toISOString(),
    userAgent:navigator.userAgent,
    screen:{w:screen.width,h:screen.height},
    taskOrder,
    additionalOptionOrder,
    comprehensionOptionOrder,
    tasks:[],
    checks:{comprehension_attempts:[]},
    post:{},
    events:[]
  };

  let taskIndex=0;
  let screenStart=performance.now();
  let currentRoute=null;
  let currentData={};
  let historyStack=[];
  let activeTimer=null;
  let fadeTimer=null;
  let completionTransferTimer=null;
  let completionTransferAcknowledged=false;
  let comprehensionCheckStartTime=null;

  function clone(value){ return JSON.parse(JSON.stringify(value)); }

  function snapshotMutable(){
    return {
      taskIndex,
      tasks:clone(state.tasks),
      checks:clone(state.checks),
      post:clone(state.post)
    };
  }

  function restoreMutable(snapshot){
    taskIndex=snapshot.taskIndex;
    state.tasks=clone(snapshot.tasks);
    state.checks=clone(snapshot.checks);
    state.post=clone(snapshot.post);
  }

  function event(type,data={}){
    state.events.push({
      type,
      route:currentRoute,
      t_ms:Math.round(performance.now()),
      ...data
    });
  }

  function setProgress(step,label){
    $("#bar").style.width=(100*step/TOTAL_STEPS)+"%";
    $("#ptext").textContent=label;
  }

  function rt(){ return Math.round(performance.now()-screenStart); }

  function esc(value){
    return String(value).replace(/[&<>"']/g,character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character]));
  }

  function captureForm(){
    const data={};
    app.querySelectorAll("input,select,textarea").forEach(element => {
      if(element.type==="radio"){
        if(element.checked) data["radio:"+element.name]=element.value;
      } else if(element.type==="checkbox"){
        data["check:"+(element.id||element.name)]=element.checked;
      } else {
        const key=element.id||element.name;
        if(key) data["value:"+key]=element.value;
      }
    });
    return data;
  }

  function restoreForm(data){
    if(!data) return;
    Object.entries(data).forEach(([key,value]) => {
      if(key.startsWith("radio:")){
        const name=key.slice(6);
        const match=[...app.querySelectorAll(`input[name="${CSS.escape(name)}"]`)].find(element => element.value===String(value));
        if(match) match.checked=true;
      } else if(key.startsWith("check:")){
        const id=key.slice(6);
        const element=document.getElementById(id) || document.querySelector(`[name="${CSS.escape(id)}"]`);
        if(element) element.checked=Boolean(value);
      } else if(key.startsWith("value:")){
        const id=key.slice(6);
        const element=document.getElementById(id) || document.querySelector(`[name="${CSS.escape(id)}"]`);
        if(element) element.value=value;
      }
    });
  }

  function backButtonHTML(){
    return "";
  }

  function navButtons(nextId="next",nextText="NEXT",showNext=true){
    return `<div class="btnrow">${showNext?`<button type="button" id="${esc(nextId)}">${esc(nextText)}</button>`:""}</div>`;
  }

  function mount(html,restoredForm=null,screenClass=""){
    const extraClass=screenClass ? ` ${screenClass}` : "";
    document.body.classList.toggle("testConditionScreen",screenClass==="testModeScreen");
    app.innerHTML=`<section class="screen${extraClass}">${html}</section>`;
    window.scrollTo(0,0);
    screenStart=performance.now();
    restoreForm(restoredForm);
  }

  function fadeTo(renderCallback){
    if(fadeTimer){
      clearTimeout(fadeTimer);
      fadeTimer=null;
    }
    app.classList.add("screenFading");
    fadeTimer=setTimeout(()=>{
      renderCallback();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        app.classList.remove("screenFading");
        fadeTimer=null;
      }));
    },250);
  }

  function navigate(route,data={},options={}){
    if(activeTimer){
      clearTimeout(activeTimer);
      activeTimer=null;
    }

    if(currentRoute && !options.replace){
      historyStack.push({
        route:currentRoute,
        data:clone(currentData),
        snapshot:options.snapshotBefore || snapshotMutable(),
        form:options.formBefore || captureForm()
      });
    }

    currentRoute=route;
    currentData=clone(data);
    fadeTo(()=>renderRoute(route,currentData,options.restoredForm||null));
  }

  function replaceRoute(route,data={}){
    if(activeTimer){
      clearTimeout(activeTimer);
      activeTimer=null;
    }
    currentRoute=route;
    currentData=clone(data);
    fadeTo(()=>renderRoute(route,currentData,null));
  }

  function goBack(){
    if(!historyStack.length) return;
    if(activeTimer){
      clearTimeout(activeTimer);
      activeTimer=null;
    }
    const previous=historyStack.pop();
    restoreMutable(previous.snapshot);
    currentRoute=previous.route;
    currentData=clone(previous.data);
    event("navigate_back",{to:currentRoute});
    fadeTo(()=>renderRoute(currentRoute,currentData,previous.form));
  }

  function selected(name){
    const element=document.querySelector(`input[name="${CSS.escape(name)}"]:checked`);
    return element ? element.value : null;
  }

  function warn(message,html=false){
    let box=$("#warn");
    if(!box){
      box=document.createElement("div");
      box.id="warn";
      box.className="notice warn";
      const buttons=$(".btnrow");
      if(buttons) buttons.before(box);
      else app.querySelector(".screen").appendChild(box);
    }
    if(html) box.innerHTML=message;
    else box.textContent=message;
    box.classList.remove("hidden");
    box.scrollIntoView({behavior:"smooth",block:"center"});
  }

  function priceNote(){
    return '<p>All product alternatives presented within this product-choice task have the same price.</p>';
  }

  function objectiveAlignmentReminder(){
    return cond_obj
      ? "The recommendation is based on the values specified in my task-specific choice objectives."
      : "The recommendation is based on a standard set of values used for all users.";
  }

  function card(name,role,values,hideRole=false){
    const profile=PROFILES[name];
    const roleMarkup=hideRole ? "" : `<div class="role">${esc(role)}</div><div class="divider"></div>`;
    const roleClass=role==="AI agent’s revised recommendation" ? " wideRevisedRole" : "";
    return `<div class="productCard${hideRole ? " noRole" : ""}${roleClass}" aria-label="${esc(role)} for ${esc(name)}">
      ${roleMarkup}
      ${profile.attrs.map((attribute,index)=>`<div class="attr"><span title="${esc(attribute)}">${esc(attribute)}</span><strong>${esc(values[index])}</strong></div>`).join("")}
    </div>`;
  }

  function productImage(name){

  function renderRoute(route,data,restoredForm){
    switch(route){
      case "testCondition": return renderTestCondition(restoredForm);
      case "instructions": return renderInstructions(restoredForm);
      case "about": return renderAbout(restoredForm);
      case "attention": return renderAttention(restoredForm);
      case "countdown": return renderCountdown(restoredForm);
      case "taskIntro": return renderTaskIntro(restoredForm);
      case "taskIntroDetails": return renderTaskIntroDetails(restoredForm);
      case "target": return renderTarget(data.index,restoredForm);
      case "wait": return renderWait(data.index,restoredForm);
      case "waitRevised": return renderWaitRevised(data.index,restoredForm);
      case "initial": return renderInitial(data.index,restoredForm);
      case "revised": return renderRevised(data.index,restoredForm);
      case "options": return renderOptions(data.index,restoredForm);
      case "postAutonomy": return renderPostAutonomy(restoredForm);
      case "goalPriority": return renderGoalPriority(restoredForm);
      case "alignment": return renderAlignment(restoredForm);
      case "demographics": return renderDemographics(restoredForm);
      case "complete": return renderComplete();
      default: throw new Error("Unknown route: "+route);
    }
  }

  function renderTestCondition(restoredForm){
    setProgress(0,"Test Mode");
    const conditions={
      1:{factor:"Low Autonomy × Low Goal Alignment",detail:"Override/revised recommendation unavailable; standard values are used for all users."},
      2:{factor:"High Autonomy × Low Goal Alignment",detail:"Override/revised recommendation available; standard values are used for all users."},
      3:{factor:"Low Autonomy × High Goal Alignment",detail:"Override/revised recommendation unavailable; your task-specific choice objectives are used."},
      4:{factor:"High Autonomy × High Goal Alignment",detail:"Override/revised recommendation available; your task-specific choice objectives are used."}
    };

    const cell=(value)=>{
      const item=conditions[value];
      return `<label class="testConditionCell">
        <input type="radio" name="test_condition" value="${value}">
        <span class="testConditionNumber">Condition ${value}</span>
        <span class="testConditionFactor">${esc(item.factor)}</span>
        <span class="testConditionDetail">${esc(item.detail)}</span>
      </label>`;
    };

    mount(`<h2>Test Mode: Select Experimental Condition</h2>
      <div class="notice"><strong>Testing only.</strong> This researcher-facing screen is not shown in normal participant mode.</div>
      <div class="testDesignWrap" aria-label="Two by two experimental design: Autonomy by Goal Alignment">
        <div class="testDesignMatrix">
          <div class="testMatrixCorner">Experimental Design</div>
          <div class="testMatrixColHead"><span class="factorName">Autonomy</span>Low</div>
          <div class="testMatrixColHead"><span class="factorName">Autonomy</span>High</div>

          <div class="testMatrixRowHead"><span class="factorName">Goal Alignment</span>Low</div>
          ${cell(1)}
          ${cell(2)}

          <div class="testMatrixRowHead"><span class="factorName">Goal Alignment</span>High</div>
          ${cell(3)}
          ${cell(4)}
        </div>
      </div>
      ${navButtons("startTest","START TEST")}`,restoredForm,"testModeScreen");

    if(condition && [1,2,3,4].includes(condition)){
      const preselected=app.querySelector(`input[name="test_condition"][value="${condition}"]`);
      if(preselected) preselected.checked=true;
    }

    $("#startTest").onclick=()=>{
      const selectedCondition=selected("test_condition");
      if(selectedCondition===null) return warn("Please select an experimental condition.");

      condition=Number(selectedCondition);
      const factors=factorsForCondition(condition);
      cond_aut=factors.cond_aut;
      cond_obj=factors.cond_obj;
      state.condition=condition;
      state.cond_aut=cond_aut;
      state.cond_obj=cond_obj;
      state.test_condition_selected=condition;
      event("test_condition_selected",{condition,cond_aut,cond_obj,rt_ms:rt()});
      navigate("instructions");
    };
  }

    mount(`<h2>General Instructions</h2>
      <ul>
        <li>This task requires your full attention.</li>
        <li>Complete it on a desktop or laptop computer only.</li>
        <li>Complete it in one sitting, without breaks.</li>
        <li>Do not browse the web or use your phone or another device until the task is complete.</li>

  function renderAbout(restoredForm){
    setProgress(3,"About the AI Agent");
    const objectiveText=cond_obj
      ? [
          'The AI agent ranks products based on the values specified in <span class="aboutBlue">your task-specific choice objectives</span>.',
          'In other words, it <span class="aboutBlue">prioritises your objectives</span> when generating its recommendations.'
        ]
      : [
          'The AI agent ranks products based on <span class="aboutBlue">a standard set of values that is the same for all users</span>, rather than the values specified in <span class="aboutBlue">your task-specific choice objectives</span>.',
          'In other words, <span class="aboutBlue">it does not prioritise your objectives</span> when generating its recommendations.'
        ];

    const autonomyText=cond_aut
      ? [
          '<span class="aboutBlue">You can choose</span> whether to ask the AI agent to revise its recommendation.',
          '<span class="aboutBlue">You can override the recommendation</span> and ask the AI agent to generate a revised recommendation before making your final choice.'
        ]
      : [
          '<span class="aboutBlue">You cannot choose</span> whether to ask the AI agent to revise its recommendation.',
          '<span class="aboutBlue">You cannot override</span> the recommendation or ask the AI agent to generate a revised recommendation before making your final choice.'
        ];

    mount(`<h2>About the AI Agent</h2>
      <p>An AI agent will make a recommendation in each of the five product-choice tasks.</p>
      <div class="manip">
        <h3>How does the AI agent rank and recommend products? Which objectives does it pursue?</h3>
        <p>${objectiveText[0]}</p>
        <p>${objectiveText[1]}</p>
      </div>
      <div class="manip">
        <h3>How you can choose whether to ask the AI agent to revise its recommendation?</h3>
        <p>${autonomyText[0]}</p>
        <p>${autonomyText[1]}</p>
      </div>
      <label class="aboutConfirm"><input type="checkbox" id="aboutRead" name="about_read" value="1">I confirm that I have read the description of the AI agent.</label>
      ${navButtons()}`,restoredForm);

    app.querySelector(".screen").classList.add("compactAbout");
    const aboutRead=$("#aboutRead");
    const nextButton=$("#next");
    const syncAboutConfirmation=()=>{ nextButton.disabled=!aboutRead.checked; };
    aboutRead.addEventListener("change",syncAboutConfirmation);
    syncAboutConfirmation();

    nextButton.onclick=()=>{
      if(!aboutRead.checked) return;
      state.checks.about_description_confirmed=1;
      event("about_agent_next",{rt_ms:rt(),description_confirmed:1});
      navigate("attention");
    };
  }

  function renderAttention(restoredForm){
    setProgress(4,"Quick Understanding Check");
    if(comprehensionCheckStartTime===null) comprehensionCheckStartTime=performance.now();

    const objectiveLabels={
      0:"A standard set of values that is the same for all users.",
      1:"The values specified in my task-specific choice objectives.",
      9:"None of the above."
    };
    const autonomyLabels={
      0:"No.",
      1:"Yes.",
      9:"In some tasks."
    };
    const optionHTML=(name,order,labels)=>order.map(value=>
      `<label><input type="radio" name="${esc(name)}" value="${value}">${esc(labels[value])}</label>`
    ).join("");

    mount(`<h2>Quick Understanding Check</h2>
      <div class="manip">
        <p>According to the description of the AI agent, which values does it use to rank products?</p>
        <div class="choiceList">
          ${optionHTML("ac_obj",state.comprehensionOptionOrder.objective,objectiveLabels)}
        </div>
      </div>
      <div class="manip">
        <p>According to the description of the AI agent, can you ask it to generate a revised recommendation before making your final choice?</p>
        <div class="choiceList">
          ${optionHTML("ac_aut",state.comprehensionOptionOrder.autonomy,autonomyLabels)}
        </div>
      </div>
      <div id="attentionFeedback" class="notice warn hidden"></div>
      ${navButtons("check","CHECK MY ANSWERS")}`,restoredForm);

    app.querySelector(".screen").classList.add("compactAttention");

    $("#check").onclick=()=>{
      const objectiveAnswer=selected("ac_obj");
      const autonomyAnswer=selected("ac_aut");
      if(objectiveAnswer===null || autonomyAnswer===null){
        return warn("Please answer both questions before continuing.");
      }

      const attemptRT=rt();
      const objectiveCorrect=Number(objectiveAnswer)===cond_obj;
      const autonomyCorrect=Number(autonomyAnswer)===cond_aut;
      const attemptNumber=state.checks.comprehension_attempts.length+1;

      state.checks.comprehension_attempts.push({
        attempt:attemptNumber,
        objective_answer:Number(objectiveAnswer),
        objective_correct:objectiveCorrect?1:0,
        autonomy_answer:Number(autonomyAnswer),
        autonomy_correct:autonomyCorrect?1:0,
        rt_ms:attemptRT
      });

      if(attemptNumber===1){
        state.checks.comprehension_first_attempt_objective_correct=objectiveCorrect?1:0;
        state.checks.comprehension_first_attempt_autonomy_correct=autonomyCorrect?1:0;
        state.checks.comprehension_first_attempt_correct=(objectiveCorrect && autonomyCorrect)?1:0;
      }
      state.checks.comprehension_failed_attempts=state.checks.comprehension_attempts.filter(item=>
        item.objective_correct!==1 || item.autonomy_correct!==1
      ).length;

      if(!objectiveCorrect || !autonomyCorrect){
        event("comprehension_check_failed",{
          attempt:attemptNumber,
          objective_correct:objectiveCorrect?1:0,
          autonomy_correct:autonomyCorrect?1:0,
          failed_attempts:state.checks.comprehension_failed_attempts
        });

        const objectiveClarification=cond_obj
          ? "The AI agent ranks products according to the values specified in your task-specific choice objectives."
          : "The AI agent ranks products according to a standard set of values that is the same for all users, rather than your task-specific choice objectives.";

        const autonomyClarification=cond_aut
          ? "You can override the initial recommendation and ask the AI agent to generate a revised recommendation."
          : "You cannot override the initial recommendation or ask the AI agent to generate a revised recommendation.";

        const feedback=$("#attentionFeedback");
        feedback.innerHTML=`<strong>There was an error in one or more of your answers.</strong>
          <p>Please review the description of the AI agent below and answer both questions again:</p>
          <p><em>${objectiveClarification}<br>${autonomyClarification}</em></p>`;
        feedback.classList.remove("hidden");
        document.querySelectorAll('input[name="ac_obj"],input[name="ac_aut"]').forEach(input=>input.checked=false);
        feedback.scrollIntoView({behavior:"smooth",block:"center"});
        screenStart=performance.now();
        return;
      }

      const snapshotBefore=snapshotMutable();
      const formBefore=captureForm();
      state.checks.comprehension_obj_answer=Number(objectiveAnswer);
      state.checks.comprehension_obj_correct=1;
      state.checks.comprehension_aut_answer=Number(autonomyAnswer);
      state.checks.comprehension_aut_correct=1;
      state.checks.comprehension_check_pass_attempt=attemptNumber;
      state.checks.comprehension_check_passed=1;
      state.checks.comprehension_check_total_rt_ms=state.checks.comprehension_attempts.reduce((sum,item)=>sum+item.rt_ms,0);
      state.checks.comprehension_total_time_ms=Math.round(performance.now()-comprehensionCheckStartTime);
      event("comprehension_check_passed",{
        attempt:attemptNumber,
        first_attempt_correct:state.checks.comprehension_first_attempt_correct,
        failed_attempts:state.checks.comprehension_failed_attempts,
        total_time_ms:state.checks.comprehension_total_time_ms
      });
      taskIndex=0;
      navigate("countdown",{}, {snapshotBefore,formBefore});
    };
  }

  function renderCountdown(restoredForm){

    mount(`<div class="countdownScreen">

    event("task_countdown_start",{seconds:4});
    const tick=()=>{
      count-=1;
      if(count>=1){
        const number=document.getElementById("countdownNumber");
        if(number) number.textContent=String(count);
        const label=document.getElementById("countdownLabel");
        if(label) label.textContent=count===1 ? "second" : "seconds";
        activeTimer=setTimeout(tick,1000);
      } else {
        activeTimer=null;
        event("task_countdown_complete",{seconds:4});
        replaceRoute("target",{index:0});
      }
    };
    activeTimer=setTimeout(tick,1000);
  }

  function profileAttributeUnits(profile){
    return profile.target.map((_,attributeIndex)=>{
      const values=[profile.target[attributeIndex],...profile.items.map(item=>item[1][attributeIndex])];
      const unique=[...new Set(values)].sort((a,b)=>a-b);
      const positiveSteps=[];
      for(let i=1;i<unique.length;i++){
        const difference=unique[i]-unique[i-1];
        if(difference>0) positiveSteps.push(difference);
      }
      return positiveSteps.length ? Math.min(...positiveSteps) : 1;
    });
  }

  function normalizedMAD(name,values){
    const profile=PROFILES[name];
    const units=profileAttributeUnits(profile);
    const score=values.reduce((sum,value,index)=>
      sum+(Math.abs(Number(value)-Number(profile.target[index]))/units[index]),0
    )/profile.target.length;
    return Number(score.toFixed(6));
  }

  function finalAccuracyMetrics(name,values){
    const finalScore=normalizedMAD(name,values);
    const profileScores=PROFILES[name].items.map(item=>normalizedMAD(name,item[1]));
    const uniqueScores=[...new Set(profileScores.map(score=>score.toFixed(6)))]
      .map(Number)
      .sort((a,b)=>a-b);
    const rank=uniqueScores.findIndex(score=>Math.abs(score-finalScore)<1e-9)+1;
    const mostAccurate=Math.abs(finalScore-uniqueScores[0])<1e-9 ? 1 : 0;
    return {
      normalized_mad:finalScore,
      accuracy_rank:rank,
      most_accurate:mostAccurate,
      bonus_eligible:mostAccurate
    };
  }

  function finishTask(index,source,label,values,taskAlreadyMutated=false){
    const snapshotBefore=snapshotMutable();
    const formBefore=captureForm();
    const task=currentTask(index);

    if(!task.initial_action) task.initial_action=source==="initial"?"accept":"unknown";
    if(!task.initial_action_rt_ms) task.initial_action_rt_ms=rt();
    if(source==="initial") task.initial_action="accept";
    if(source==="revised" && !taskAlreadyMutated) task.revised_action="accept";

    task.final_source=source;
    task.final_choice=label;
    task.final_values=clone(values);
    const accuracy=finalAccuracyMetrics(task.task,values);
    task.final_normalized_mad=accuracy.normalized_mad;
    task.final_accuracy_rank=accuracy.accuracy_rank;
    task.final_most_accurate=accuracy.most_accurate;
    task.bonus_eligible=accuracy.bonus_eligible;
    task.final_ai_reliance=(source==="initial" || source==="revised")?1:0;
    task.override_used=task.initial_action==="override"?1:0;
    task.completed_iso=new Date().toISOString();

    event("task_complete",{
      task:task.task,
      index,
      final_source:source,
      final_choice:label,
      final_normalized_mad:task.final_normalized_mad,
      final_accuracy_rank:task.final_accuracy_rank,
      final_most_accurate:task.final_most_accurate,
      bonus_eligible:task.bonus_eligible
    });

    if(index+1<state.taskOrder.length){
      taskIndex=index+1;
      navigate("target",{index:index+1},{snapshotBefore,formBefore});
    } else {
      taskIndex=state.taskOrder.length;
      navigate("postAutonomy",{}, {snapshotBefore,formBefore});
    }
  }

  function renderPostAutonomy(restoredForm){
    setProgress(11,"Recommendation-process questions");
    const autonomyItems=[
      {id:"a1",text:"I had room to decide whether to request a revised recommendation."},
      {id:"a2",text:"I had flexibility in deciding whether to override the AI agent’s initial recommendation."},
      {id:"a3",text:"I had meaningful control over whether the AI agent reconsidered its initial recommendation."},
      {id:"a4",text:"It was up to me whether the AI agent generated a revised recommendation."}
    ];
    mount(`<p>Thinking about the AI agent’s recommendation process before you made your final product choices, please indicate your level of agreement with the following statements:</p>
      ${matrixHTML(autonomyItems,"Agreement with statements about the AI agent’s recommendation process")}
      ${navButtons()}`,restoredForm);

    $("#next").onclick=()=>{
      for(let i=1;i<=4;i++){
        if(selected("a"+i)===null) return warn("Please answer all four statements.");
      }
      const snapshotBefore=snapshotMutable();
      const formBefore=captureForm();
      state.post.MC_aut1=Number(selected("a1"));
      state.post.MC_aut2=Number(selected("a2"));
      state.post.MC_aut3=Number(selected("a3"));
      state.post.MC_aut4=Number(selected("a4"));
      // Retain the array for backward compatibility while also exposing four scalar fields for Qualtrics/SPSS.
      state.post.MC_aut_override=[state.post.MC_aut1,state.post.MC_aut2,state.post.MC_aut3,state.post.MC_aut4];
      state.post.MC_aut_override_rt_ms=rt();
      navigate("goalPriority",{}, {snapshotBefore,formBefore});
    };
  }

  function renderGoalPriority(restoredForm){
    setProgress(12,"Values prioritised");
    mount(`<p><strong>When ranking products, which values do you think the AI agent prioritised?</strong></p>
      <div class="scaleBlock">
        <div class="bipolarAnchorGrid" aria-hidden="true">
          <div class="bipolarAnchor left"><span>A standard set of values<br>that is the same for all users</span></div>
          <div class="bipolarAnchor right"><span>An individual set of values<br>that is specific to my objectives</span></div>
        </div>
        <div class="bipolarRow" role="radiogroup" aria-label="Perceived values prioritised by the AI agent">
          ${["Far left","Left","Slightly left","Middle","Slightly right","Right","Far right"].map((label,index)=>`<label aria-label="${label}"><input type="radio" name="goal" value="${index+1}"></label>`).join("")}
        </div>
      </div>
      ${navButtons()}`,restoredForm);

    $("#next").onclick=()=>{
      if(selected("goal")===null) return warn("Please answer the question.");
      const snapshotBefore=snapshotMutable();
      const formBefore=captureForm();
      state.post.MC_goal_priority=Number(selected("goal"));
      state.post.MC_goal_priority_rt_ms=rt();
      navigate("alignment",{}, {snapshotBefore,formBefore});
    };
  }

  function renderAlignment(restoredForm){
    setProgress(13,"Objective-alignment questions");
    const alignmentItems=[
      {id:"align1",text:"The AI agent’s objectives were fully aligned with my objectives in this task."},
      {id:"align2",text:"The AI agent focused on accomplishing my objectives in this task."},
      {id:"align3",text:"The AI agent’s objectives were fully compatible with my objectives."},
      {id:"align4",text:"The AI agent and I share the same objectives in what we are trying to accomplish."}
    ];
    mount(`<p>Thinking about the objectives guiding the AI agent’s recommendations, please indicate your level of agreement with the following statements:</p>
      ${matrixHTML(alignmentItems,"Agreement with statements about the objectives guiding the AI agent’s recommendations")}
      ${navButtons()}`,restoredForm);

    $("#next").onclick=()=>{
      for(const name of ["align1","align2","align3","align4"]){
        if(selected(name)===null) return warn("Please answer all four statements.");
      }
      const snapshotBefore=snapshotMutable();
      const formBefore=captureForm();
      state.post.MC_align1=Number(selected("align1"));
      state.post.MC_align2=Number(selected("align2"));
      state.post.MC_align3=Number(selected("align3"));
      state.post.MC_align4=Number(selected("align4"));
      // Retain the array for backward compatibility while also exposing four scalar fields for Qualtrics/SPSS.
      state.post.objective_alignment=[state.post.MC_align1,state.post.MC_align2,state.post.MC_align3,state.post.MC_align4];
      state.post.objective_alignment_rt_ms=rt();
      navigate("demographics",{}, {snapshotBefore,formBefore});
    };
  }

  function renderDemographics(restoredForm){
    setProgress(14,"Final Questions");
    mount(`<h2>Final Questions</h2>
      <div class="field">
        <label for="gender">What is your gender?</label>
        <select id="gender" class="compactSelect">
          <option value="">Select…</option>
          <option>Male</option>
          <option>Female</option>
          <option>Non-binary / another identity</option>
          <option>Prefer not to say</option>
        </select>
      </div>
      <div class="field">
        <label for="age">What is your age?</label>
        <input id="age" class="compactAge" type="number" min="18" max="75" step="1" inputmode="numeric">
      </div>
      <div class="field">
        <label for="edu">What is your highest level of education?</label>
        <select id="edu" class="compactSelect">
          <option value="">Select…</option>
          <option>Completed lower-secondary or less</option>
          <option>Completed upper-secondary</option>
          <option>Studied in higher education</option>
          <option>Completed bachelor’s degree</option>
          <option>Completed master’s degree or above</option>
        </select>
      </div>
      <div class="field">
        <label for="comments">Was everything clear? Is there anything you would like to add?</label>
        <textarea id="comments"></textarea>
      </div>
      ${navButtons("submit","SUBMIT")}`,restoredForm);

    $("#submit").onclick=()=>{
      if(!$("#gender").value || !$("#age").value || !$("#edu").value){
        return warn("Please complete gender, age, and education.");
      }
      const ageValue=Number($("#age").value);
      if(!Number.isInteger(ageValue) || ageValue<18 || ageValue>75){
        return warn("Please enter your age as a whole number from 18 to 75.");
      }
      const snapshotBefore=snapshotMutable();
      const formBefore=captureForm();
      state.post.gender=$("#gender").value;
      state.post.age=ageValue;
      state.post.education=$("#edu").value;
      state.post.comments=$("#comments").value.trim();
      state.post.demographics_rt_ms=rt();
      navigate("complete",{}, {snapshotBefore,formBefore});
    };
  }

  function renderComplete(){
    state.endISO=new Date().toISOString();
    state.duration_ms=Math.round(performance.now());
    state.summary={
      final_ai_reliance_total:state.tasks.reduce((sum,task)=>sum+(task.final_ai_reliance||0),0),
      override_count:state.tasks.reduce((sum,task)=>sum+(task.override_used||0),0),
      additional_option_count:state.tasks.filter(task=>task.final_source==="additional").length,
      most_accurate_choice_count:state.tasks.reduce((sum,task)=>sum+(task.final_most_accurate||0),0),
      bonus_eligible_choice_count:state.tasks.reduce((sum,task)=>sum+(task.bonus_eligible||0),0)
    };

    setProgress(15,"Complete");
    const payload=JSON.stringify(state);
    const transferId=state.startISO+"|"+state.buildVersion;
    // Explicit scalar manipulation-check fields for the Qualtrics parent receiver.
    // The parent can write each entry in this map directly to a Qualtrics Embedded Data field,
    // ensuring that the eight manipulation-check items appear as eight separate SAV variables.
    const embeddedData={
      MC_aut1:state.post.MC_aut1,
      MC_aut2:state.post.MC_aut2,
      MC_aut3:state.post.MC_aut3,
      MC_aut4:state.post.MC_aut4,
      MC_align1:state.post.MC_align1,
      MC_align2:state.post.MC_align2,
      MC_align3:state.post.MC_align3,
      MC_align4:state.post.MC_align4
    };
    const completionMessage={
      type:"8520_STUDY_COMPLETE",
      transferId,
      studyVersion:state.studyVersion,
      buildVersion:state.buildVersion,
      payload:state,
      embeddedData,
      json:payload
    };

    try { localStorage.setItem("8520.04.05.App.Rev_MC.lastSubmission",payload); } catch(error) {}

    function sendCompletionMessage(){
      try { window.parent.postMessage(completionMessage,"*"); } catch(error) {}
      try {
        if(window.top && window.top!==window.parent){
          window.top.postMessage(completionMessage,"*");
        }
      } catch(error) {}
    }

    function receiveCompletionAcknowledgement(messageEvent){
      const message=messageEvent.data;
      if(!message || message.type!=="8520_STUDY_RECEIVED") return;
      if(message.transferId && message.transferId!==transferId) return;
      completionTransferAcknowledged=true;
      if(completionTransferTimer){
        clearInterval(completionTransferTimer);
        completionTransferTimer=null;
      }
      const status=$("#transferStatus");
      if(status) status.textContent="Your responses were transferred successfully. Please wait while you are returned to the survey.";
      window.removeEventListener("message",receiveCompletionAcknowledgement);
    }

    window.addEventListener("message",receiveCompletionAcknowledgement);
    sendCompletionMessage();

    let transferAttempts=1;
    completionTransferTimer=setInterval(()=>{
      if(completionTransferAcknowledged || transferAttempts>=30){
        clearInterval(completionTransferTimer);
        completionTransferTimer=null;
        return;
      }
      transferAttempts+=1;
      sendCompletionMessage();
    },1000);

    mount(`<h2>Task complete</h2>
      <p>Your responses have been recorded.</p>
      <p id="transferStatus" class="muted">Please wait while your responses are transferred and you are returned to the survey.</p>
      `);

    const returnURL=qs.get("return_url") || qs.get("completion_url");
    if(returnURL) setTimeout(()=>{ location.href=returnURL; },1200);
  }

  const initialRoute=testMode ? "testCondition" : "instructions";
  currentRoute=initialRoute;
  currentData={};
  renderRoute(initialRoute,{},null);
})();
</script>
